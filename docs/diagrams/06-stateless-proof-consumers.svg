<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="title desc">
  <!-- svg-source:excalidraw -->
  <title id="title">Proof consumers across the slot boundary</title>
  <desc id="desc">A timeline shows a theoretical proof for block N available at t=9. The next proposer needs it by t=12, and a stateless attester needs it by t=15.</desc>
  <defs>
    <style>
      @font-face {
        font-family: "Virgil";
        src: url("https://excalidraw.com/Virgil.woff2");
      }
      text {
        font-family: "Virgil", "Segoe UI Emoji", sans-serif;
      }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1971c2"></path>
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e1e1e"></path>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="660" fill="#ffffff"></rect>
  <text x="30" y="45" font-size="28" fill="#1e1e1e">Proof consumers across the slot boundary</text>

  <rect x="250" y="70" width="700" height="55" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2"></rect>
  <text x="600" y="105" font-size="22" text-anchor="middle" fill="#1971c2">Slot N</text>
  <rect x="950" y="70" width="200" height="55" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"></rect>
  <text x="1050" y="105" font-size="22" text-anchor="middle" fill="#1971c2">Slot N+1</text>

  <line x1="250" y1="180" x2="1150" y2="180" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow-dark)"></line>
  <g stroke-width="3">
    <line x1="250" y1="160" x2="250" y2="200" stroke="#1971c2"></line>
    <line x1="600" y1="160" x2="600" y2="200" stroke="#e03131"></line>
    <line x1="775" y1="155" x2="775" y2="205" stroke="#f08c00" stroke-dasharray="7 7"></line>
    <line x1="950" y1="155" x2="950" y2="205" stroke="#1971c2"></line>
    <line x1="1135" y1="155" x2="1135" y2="205" stroke="#1971c2"></line>
  </g>

  <g font-size="18" text-anchor="middle">
    <text x="250" y="225" fill="#1971c2">t=0</text>
    <text x="600" y="225" fill="#e03131">t=6</text>
    <text x="775" y="225" fill="#f08c00">t=9</text>
    <text x="950" y="225" fill="#1971c2">t=12</text>
    <text x="1135" y="225" fill="#1971c2">t=15</text>
  </g>
  <g font-size="16" text-anchor="middle" fill="#1e1e1e">
    <text x="250" y="250">Beacon block N</text>
    <text x="600" y="250">Payload N due</text>
    <text x="775" y="247">Candidate proof</text>
    <text x="775" y="268">availability</text>
    <text x="950" y="247">Block N+1</text>
    <text x="950" y="268">proposal</text>
    <text x="1135" y="247">Attestation</text>
    <text x="1135" y="268">to N+1</text>
  </g>

  <g stroke="#adb5bd" stroke-width="1.5">
    <line x1="250" y1="340" x2="1150" y2="340"></line>
    <line x1="250" y1="440" x2="1150" y2="440"></line>
    <line x1="250" y1="540" x2="1150" y2="540"></line>
  </g>
  <g font-size="19" text-anchor="end" fill="#1e1e1e">
    <text x="220" y="329">Execution proof</text>
    <text x="220" y="352">for block N</text>
    <text x="220" y="429">Next proposer</text>
    <text x="220" y="452">for block N+1</text>
    <text x="220" y="529">Stateless attester</text>
    <text x="220" y="552">for block N+1</text>
  </g>

  <line x1="775" y1="360" x2="775" y2="540" stroke="#f08c00" stroke-width="2" stroke-dasharray="7 7"></line>
  <rect x="640" y="300" width="270" height="70" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2.5" stroke-dasharray="7 7"></rect>
  <text x="775" y="328" font-size="18" text-anchor="middle" fill="#9c6500">Proof for block N available</text>
  <text x="775" y="354" font-size="16" text-anchor="middle" fill="#9c6500">theoretical candidate: t=9</text>

  <circle cx="775" cy="440" r="7" fill="#1971c2"></circle>
  <line x1="775" y1="440" x2="945" y2="440" stroke="#1971c2" stroke-width="4" marker-end="url(#arrow-blue)"></line>
  <text x="860" y="419" font-size="17" text-anchor="middle" fill="#1971c2">verify proof N</text>
  <circle cx="950" cy="440" r="9" fill="#d0ebff" stroke="#1971c2" stroke-width="3"></circle>
  <text x="950" y="474" font-size="17" text-anchor="middle" fill="#1971c2">needed before parent choice</text>

  <circle cx="775" cy="540" r="7" fill="#1971c2"></circle>
  <line x1="775" y1="540" x2="1130" y2="540" stroke="#1971c2" stroke-width="4" marker-end="url(#arrow-blue)"></line>
  <text x="955" y="519" font-size="17" text-anchor="middle" fill="#1971c2">verify proof N</text>
  <circle cx="1135" cy="540" r="9" fill="#d0ebff" stroke="#1971c2" stroke-width="3"></circle>
  <text x="1135" y="574" font-size="17" text-anchor="end" fill="#1971c2">needed before vote</text>

  <path d="M 600 595 L 600 610 L 1135 610 L 1135 595" fill="none" stroke="#1971c2" stroke-width="2"></path>
  <text x="867.5" y="638" font-size="18" text-anchor="middle" fill="#1971c2">9-second ePBS validation budget for other validators</text>
</svg>
