<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1065 470" width="1065" height="470" role="img" aria-labelledby="title desc">
  <title id="title">Delayed state root builder timeline</title>
  <desc id="desc">During slot N minus 1, builder N calculates root N minus 1. Block N contains that root. During slot N, builder N proves block N without root N while candidate builders for N plus 1 calculate root N. The selected builder includes root N in block N plus 1. The eight-percent root-calculation estimate is unpublished and proof-system-specific.</desc>
  <defs>
    <style class="style-fonts">
      @font-face { font-family: Virgil; src: url(data:font/woff2;base64,); }</style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1971c2"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f9e44"/>
    </marker>
    <style>
      text { font-family: Virgil, sans-serif, "Segoe UI Emoji"; }
      .title { fill: #1e1e1e; font-size: 28px; }
      .slot { fill: #1e1e1e; font-size: 19px; }
      .time { font-size: 18px; }
      .actor { fill: #1e1e1e; font-size: 20px; }
      .main { fill: #1e1e1e; font-size: 18px; }
      .sub { fill: #495057; font-size: 15px; }
      .event { fill: #495057; font-size: 15px; }
      .note { fill: #495057; font-size: 14px; }
    </style>
  </defs>

  <rect width="1065" height="470" fill="#ffffff"/>
  <text class="title" x="15" y="36">Delayed state root: builder timeline</text>

  <text class="slot" x="245" y="73" text-anchor="middle">Slot N-1</text>
  <text class="slot" x="545" y="73" text-anchor="middle">Slot N</text>
  <text class="slot" x="845" y="73" text-anchor="middle">Slot N+1</text>
  <line x1="95" y1="105" x2="1045" y2="105" stroke="#1e1e1e" stroke-width="2"/>

  <line x1="95" y1="85" x2="95" y2="125" stroke="#1971c2" stroke-width="3"/>
  <line x1="245" y1="85" x2="245" y2="125" stroke="#e03131" stroke-width="3"/>
  <line x1="395" y1="85" x2="395" y2="125" stroke="#1971c2" stroke-width="3"/>
  <line x1="545" y1="85" x2="545" y2="125" stroke="#e03131" stroke-width="3"/>
  <line x1="620" y1="75" x2="620" y2="280" stroke="#e03131" stroke-width="3" stroke-dasharray="8 8"/>
  <line x1="695" y1="85" x2="695" y2="125" stroke="#1971c2" stroke-width="3"/>
  <line x1="995" y1="85" x2="995" y2="125" stroke="#1971c2" stroke-width="3"/>

  <text class="time" x="95" y="147" fill="#1971c2" text-anchor="middle">t=-12</text>
  <text class="time" x="245" y="147" fill="#e03131" text-anchor="middle">t=-6</text>
  <text class="time" x="395" y="147" fill="#1971c2" text-anchor="middle">t=0</text>
  <text class="time" x="545" y="147" fill="#e03131" text-anchor="middle">t=6</text>
  <text class="time" x="620" y="147" fill="#e03131" text-anchor="middle">t=9</text>
  <text class="time" x="695" y="147" fill="#1971c2" text-anchor="middle">t=12</text>
  <text class="time" x="995" y="147" fill="#1971c2" text-anchor="middle">t=24</text>

  <text class="event" x="245" y="170" text-anchor="middle">State N-1 available</text>
  <text class="event" x="545" y="170" text-anchor="middle">State N available</text>

  <text class="actor" x="10" y="222">Builder / prover N</text>
  <rect x="245" y="186" width="140" height="68" rx="13" fill="#e7f5ff" stroke="#1971c2" stroke-width="2.5" stroke-dasharray="8 7"/>
  <text class="main" x="315" y="214" font-size="17px" text-anchor="middle">Calculate</text>
  <text class="main" x="315" y="235" font-size="17px" text-anchor="middle">root N-1</text>
  <path d="M 385 219 H 389" fill="none" stroke="#1971c2" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <circle cx="395" cy="219" r="7" fill="#1971c2"/>
  <rect x="410" y="186" width="200" height="68" rx="13" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2.5" stroke-dasharray="8 7"/>
  <text class="main" x="510" y="214" text-anchor="middle">Proof N</text>
  <text class="sub" x="510" y="236" text-anchor="middle">No root N work</text>
  <path d="M 610 219 H 614" fill="none" stroke="#2f9e44" stroke-width="3" marker-end="url(#arrow-green)"/>
  <circle cx="620" cy="219" r="7" fill="#2f9e44"/>
  <text class="event" x="395" y="282" text-anchor="middle">Block N: header contains root N-1</text>

  <line x1="185" y1="304" x2="1045" y2="304" stroke="#dee2e6" stroke-width="1.5"/>

  <text class="actor" x="10" y="365">Builders for N+1</text>
  <rect x="545" y="328" width="145" height="68" rx="13" fill="#e7f5ff" stroke="#1971c2" stroke-width="2.5" stroke-dasharray="8 7"/>
  <text class="main" x="617.5" y="356" font-size="17px" text-anchor="middle">Calculate</text>
  <text class="main" x="617.5" y="377" font-size="17px" text-anchor="middle">root N</text>
  <path d="M 690 362 H 704" fill="none" stroke="#1971c2" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow-blue)"/>
  <rect x="705" y="328" width="250" height="68" rx="14" fill="#e7f5ff" stroke="#1971c2" stroke-width="2.5"/>
  <text class="main" x="830" y="356" text-anchor="middle">Selected builder N+1</text>
  <text class="sub" x="830" y="379" text-anchor="middle">Publishes header with root N</text>

  <text class="note" x="615" y="440" text-anchor="middle">Note: Root calculation is ~8% of proving time (unpublished, proof-system-specific estimate).</text>
</svg>
